name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: tar -czf ai-quotas-${{ matrix.target }}.tar.gz -C target/release ai-quotas
      - run: gh release upload "${{ github.event.release.tag_name }}" "ai-quotas-${{ matrix.target }}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
