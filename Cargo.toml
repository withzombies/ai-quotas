[package]
name = "ai-quotas"
version = "1.0.0"
edition = "2024"
description = "CLI showing quota usage and reset times across AI subscriptions (Claude, Codex, Z.ai, Grok)"
license = "Apache-2.0"

[profile.release]
strip = true
lto = "thin"

[dependencies]
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
